onboarding = false

[ui]
show_agent_labels_on_pane_borders = true

# agent_panel_scope was removed in herdr 0.7.0 (#318): the Agents panel now
# always shows all agents (previously the "all" behavior we pinned here).
[ui.toast]
delivery = "herdr"

[keys]
# SAND-style keybinds mirroring Ghostty (cmd → alt)

# Workspaces
new_workspace = "alt+shift+n"
rename_workspace = "alt+shift+w"
close_workspace = "alt+shift+x"
workspace_picker = "alt+shift+s"
previous_workspace = "alt+shift+up"
next_workspace = "alt+shift+down"

# Worktrees
new_worktree = "alt+shift+g"
open_worktree = "alt+shift+o"
remove_worktree = "alt+shift+backspace"

# S - Split
split_vertical = "alt+d"
split_horizontal = "alt+shift+d"

# A - Across (tabs)
new_tab = "alt+t"
previous_tab = "alt+shift+left"
next_tab = "alt+shift+right"
rename_tab = "alt+shift+t"
close_tab = "alt+shift+c"
switch_tab = "alt+1..9"

# N - Navigate (between panes)
focus_pane_left = "alt+ctrl+left"
focus_pane_right = "alt+ctrl+right"
focus_pane_up = "alt+ctrl+up"
focus_pane_down = "alt+ctrl+down"
cycle_pane_next = "alt+tab"
cycle_pane_previous = "alt+shift+tab"
zoom = "alt+shift+f"
resize_mode = "alt+r"

# D - Destroy
close_pane = "alt+w"

# UI
toggle_sidebar = "alt+b"
detach = "alt+q"
goto = "alt+g"
focus_agent = "alt+ctrl+1..9"

[ui.sound]
enabled = true

[session]
# Resume Claude/agent panes in their native conversation sessions after a herdr
# server restart (addon/HA/host reboot). This is herdr's default; pinned here so
# it survives any future default change and ships with the addon.
resume_agents_on_restore = true

# GHOSTWIRE theme — phosphor mint on deep slate, matching the ttyd palette.
# NOTE: keep this [theme] section LAST in this file — run.sh extracts it with
# `sed -n '/^\[theme\]/,$p'` to retrofit existing seeded configs.
[theme]
name = "vesper"

[theme.custom]
panel_bg = "reset"       # transparent — let the outer terminal background show
accent = "#2ee6a6"
text = "#b3c2ce"
subtext0 = "#8595a3"
surface0 = "#131a22"
surface1 = "#1b2530"
overlay0 = "#3d4a56"
overlay1 = "#55636f"
green = "#37d99e"
red = "#f26d78"
yellow = "#e2c488"
blue = "#6cb2ff"
teal = "#53d3e0"
mauve = "#b394f0"
peach = "#f0a56c"
