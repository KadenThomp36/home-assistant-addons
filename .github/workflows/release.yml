name: Release

on:
  push:
    tags:
      - "v*"
      - "t3code-v*"

permissions:
  contents: write

jobs:
  release:
    name: Create GitHub Release
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Determine version and add-on directory from tag
        id: version
        run: |
          ref="${GITHUB_REF_NAME}"
          case "$ref" in
            t3code-v*)
              version="${ref#t3code-v}"
              dir="t3code"
              ;;
            v*-herdr*)
              version="${ref#v}"
              dir="claude-terminal-herdr"
              ;;
            v*)
              version="${ref#v}"
              dir="claude-terminal"
              ;;
            *)
              echo "::error::Unrecognized tag format: $ref"
              exit 1
              ;;
          esac
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "dir=$dir" >> "$GITHUB_OUTPUT"

      - name: Expose add-on directory
        id: addon
        run: echo "dir=${{ steps.version.outputs.dir }}" >> "$GITHUB_OUTPUT"

      - name: Validate tag matches config.yaml
        run: |
          addon_dir="${{ steps.addon.outputs.dir }}"
          config_version=$(grep '^version:' "$addon_dir/config.yaml" | sed 's/version: *"\?\([^"]*\)"\?/\1/')
          tag_version="${{ steps.version.outputs.version }}"
          if [ "$config_version" != "$tag_version" ]; then
            echo "::error::Tag version ($tag_version) does not match $addon_dir/config.yaml version ($config_version)"
            exit 1
          fi
          echo "Version $tag_version validated against $addon_dir/config.yaml"

      - name: Extract changelog for this version
        id: changelog
        run: |
          version="${{ steps.version.outputs.version }}"
          addon_dir="${{ steps.addon.outputs.dir }}"
          # Extract content between this version's header and the next ## header
          awk -v ver="$version" \
            'BEGIN{found=0} /^## /{if(found)exit; if($2==ver)found=1; next} found{print}' \
            "$addon_dir/CHANGELOG.md" > /tmp/changelog.md
          if [ ! -s /tmp/changelog.md ]; then
            echo "::warning::No changelog entry found for version $version"
            echo "Release $version" > /tmp/changelog.md
          fi
          echo "Extracted changelog for v${version}:"
          cat /tmp/changelog.md

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          name: "v${{ steps.version.outputs.version }}"
          body_path: /tmp/changelog.md
          generate_release_notes: false
