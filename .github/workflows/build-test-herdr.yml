name: Build & Smoke Test (herdr)

on:
  pull_request:
    branches: [main]
    paths:
      - "claude-terminal-herdr/**"
      - ".github/workflows/build-test-herdr.yml"

jobs:
  lint:
    name: Lint Dockerfile
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: hadolint/hadolint-action@v3.1.0
        with:
          dockerfile: claude-terminal-herdr/Dockerfile
          failure-threshold: error
          # HA add-ons use BUILD_FROM arg for base image and Alpine rolling packages
          ignore: DL3006,DL3018

  build:
    name: Build (amd64)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build container
        uses: docker/build-push-action@v6
        with:
          context: ./claude-terminal-herdr
          push: false
          load: true
          platforms: linux/amd64
          tags: test/claude-terminal-herdr:amd64
          build-args: |
            BUILD_FROM=ghcr.io/home-assistant/amd64-base:3.21

      - name: Smoke test — image is runnable
        run: |
          docker run --rm --entrypoint /bin/bash \
            test/claude-terminal-herdr:amd64 -c "echo 'Image runs OK'"

      - name: Smoke test — scripts are executable
        run: |
          docker run --rm --entrypoint /bin/bash \
            test/claude-terminal-herdr:amd64 -c '
              for script in \
                /run.sh \
                /opt/scripts/claude-session-picker.sh \
                /opt/scripts/herdr-launch.sh \
                /opt/scripts/setup-ha-mcp.sh \
                /opt/scripts/health-check.sh \
                /opt/scripts/welcome.sh; do
                if [ ! -x "$script" ]; then
                  echo "FAIL: $script is not executable"
                  exit 1
                fi
                echo "OK: $script"
              done
            '

      - name: Smoke test — key binaries available
        run: |
          docker run --rm --entrypoint /bin/bash \
            test/claude-terminal-herdr:amd64 -c '
              for bin in node npm claude herdr git tmux jq uv; do
                if ! which "$bin" > /dev/null 2>&1; then
                  echo "FAIL: $bin not found"
                  exit 1
                fi
                echo "OK: $bin"
              done
            '

      - name: Smoke test — herdr binary reports a version
        run: |
          docker run --rm --entrypoint /bin/bash \
            test/claude-terminal-herdr:amd64 -c '
              herdr --version
            '
