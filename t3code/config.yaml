---
name: "T3 Code"
description: "T3 Code's chat GUI (drives the Claude Code CLI) embedded in Home Assistant via ingress"
version: "0.5.1"
slug: "t3code"
init: false

# Supported architectures
# As of T3 0.0.42 the `t3` npm package is a shim that pulls a per-platform,
# self-contained glibc executable (@t3code/t3-linux-<arch>); upstream publishes
# linux-x64 and linux-arm64, which is exactly this arch list. Claude Code is
# still plain npm/Node. CI (build-test-t3code.yml) validates each.
arch:
  - amd64
  - aarch64

# External resources
url: "https://github.com/KadenThomp36/home-assistant-addons"

# Web interface configuration
# Ingress proxies the HA-authenticated user to the in-container reverse proxy,
# which injects the T3 session cookie so no T3 pairing prompt is ever shown.
ingress: true
ingress_port: 3773
panel_icon: mdi:robot-happy
panel_title: "T3 Code"
panel_admin: true

# Supervisor watchdog: probes the ingress proxy over the hassio network and
# restarts the add-on if it stops answering — catches a wedged startup (proxy
# never launched) as well as a crashed proxy, without any manual restart.
watchdog: "http://[HOST]:[PORT:3773]/api/auth/session"

# Add-on configuration options
options:
  claude_effort: "high"
  claude_model: "claude-opus-5"
  claude_oauth_token: ""
  tailscale_authkey: ""
  tailscale_hostname: "t3code-ha"
  persistent_apt_packages: []
  persistent_apk_packages: []
  persistent_npm_packages: []
schema:
  claude_effort: "list(high|medium|low)?"
  claude_model: str?
  # Optional long-lived Claude Code token (from `claude setup-token`). Unlike the
  # interactive browser login, it does no refresh-token rotation, so it can't be
  # orphaned by another install sharing the same login. When set, it is exported
  # as CLAUDE_CODE_OAUTH_TOKEN and takes precedence over ~/.claude credentials.
  claude_oauth_token: password?
  # Optional tailnet-only access: set an auth key to have the add-on join the
  # tailnet and `tailscale serve` the T3 server (with T3's native pairing) at
  # https://<tailscale_hostname>.<your-tailnet>.ts.net. Leave empty for ingress-only.
  tailscale_authkey: str?
  tailscale_hostname: str?
  # Extra OS packages installed on every start. Debian/apt names since 0.5.0.
  persistent_apt_packages:
    - str
  # Deprecated pre-0.5.0 (Alpine) name. Still accepted so existing configs keep
  # validating across the Debian migration; treated as apt names, and run.sh logs
  # a warning when it is non-empty.
  persistent_apk_packages:
    - str
  persistent_npm_packages:
    - str

# Volume mappings for file access
map:
  - config:rw    # Home Assistant configuration files (a working directory for threads)
  - share:rw     # /share as an additional working directory
  - addons:rw    # local add-on sources, if you want to hack on add-ons

# API access for Home Assistant integration
hassio_api: true
hassio_role: manager
homeassistant_api: true
auth_api: true

# Service startup configuration
startup: services
